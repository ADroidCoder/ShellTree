[package]
name = "shelltree-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# 不用默认的 aws-lc-rs：它在 Windows 上编译要装 cmake 和 nasm
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# 本地终端：macOS/Linux 用 openpty，Windows 用 ConPTY
portable-pty = "0.9"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Linux 上密码存在 Secret Service 里（GNOME 钥匙环、KWallet），不开这个特性 keyring 只存在内存里，重启就没了
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
