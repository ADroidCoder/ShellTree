# 测试，以及打包 Windows 和 macOS 安装包。
# - 推送分支、提交 PR：只跑测试
# - 在 Actions 页面手动运行：测试并打包，安装包在这次运行的 Artifacts 里下载
# - 推送 v 开头的标签（例如 v0.1.0）：测试并打包，全部成功后发布一个 Release，附上安装包和自动更新用的 latest.json
name: 打包

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows 上也跑，ssh-agent、盘符这些只在 Windows 编译的代码才会被检查到
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test -p shelltree-core --no-fail-fast
      # 在本机起一个要求验证码的 SSH 服务器，测登录逻辑
      - run: cargo run -p shelltree-core --example otp
      - run: npm test
      - run: npm run check

  build:
    name: 打包 (${{ matrix.name }})
    # 平时推代码只跑测试，打包很慢，只在发版和手动运行时做
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            files: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
          - name: macOS (Apple 芯片)
            os: macos-latest
            arch: aarch64
            files: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.tar.gz*
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
            files: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz*
    runs-on: ${{ matrix.os }}
    env:
      # 自动更新包的签名私钥，在仓库 Settings → Secrets and variables → Actions 里配置
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      # 版本号不一致时，装好的新版本会以为自己还是旧版本，自动更新会一直提示，所以发版前先检查
      - name: 检查版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python3 .github/scripts/check_version.py "$GITHUB_REF_NAME"
      # 发版时必须有签名私钥，否则这个版本没有更新包，已经装了的用户收不到更新
      - name: 检查签名私钥
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::仓库的 Secrets 里没有配置 TAURI_SIGNING_PRIVATE_KEY，发版需要它来给自动更新包签名"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - name: 打包
        shell: bash
        run: |
          args=()
          [ -n "${{ matrix.target }}" ] && args+=(--target "${{ matrix.target }}")
          # 有私钥时同时生成签过名的更新包；手动运行又没配置私钥时只打普通安装包
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && args+=(--config src-tauri/tauri.updater.conf.json)
          npx tauri build "${args[@]}"
      # 两种 Mac 的更新包默认同名，上传到同一个 Release 会互相覆盖，按架构改名
      - name: 更新包按架构改名
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release/bundle/macos"
          if [ -f "$dir/ShellTree.app.tar.gz" ]; then
            mv "$dir/ShellTree.app.tar.gz" "$dir/ShellTree_${{ matrix.arch }}.app.tar.gz"
            mv "$dir/ShellTree.app.tar.gz.sig" "$dir/ShellTree_${{ matrix.arch }}.app.tar.gz.sig"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ShellTree-${{ matrix.arch || 'windows' }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 每个平台的安装包下载下来会带着 dmg/、nsis/ 这样的子目录，放到同一层才能上传
      - name: 把安装包放到同一层
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
      # 已安装的 ShellTree 从 releases/latest/download/latest.json 检查更新，没有它就收不到更新，生成失败时整个发布失败
      - name: 生成自动更新用的 latest.json
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" \
            | python3 .github/scripts/latest_json.py dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > dist/latest.json
          cat dist/latest.json
          python3 - <<'PY'
          import json
          d = json.load(open("dist/latest.json"))
          missing = {"darwin-aarch64", "darwin-x86_64", "windows-x86_64"} - set(d["platforms"])
          if missing:
              raise SystemExit(f"latest.json 缺少这些平台的更新包：{sorted(missing)}")
          PY
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: ShellTree ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/*
